<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dirt Bike Trails App</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 360px;
  background: #f4f4f4;
  padding: 12px;
  overflow-y: auto;
}

#map {
  flex: 1;
}

.item {
  background: white;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  cursor: pointer;
}

.item:hover {
  background: #eaeaea;
}

input, select, button {
  width: 100%;
  padding: 6px;
  margin-top: 6px;
}

.small {
  font-size: 12px;
  color: gray;
}
</style>
</head>

<body>

<div class="sidebar">
<h2>🏍️ Dirt Bike Finder</h2>

<button onclick="loadAll()">Load Spots</button>

<hr>

<h3>🔎 Filters</h3>

<select id="filterType">
  <option value="all">All Types</option>
  <option value="trail">Trails</option>
  <option value="mx">Tracks</option>
</select>

<select id="filterDiff">
  <option value="all">All Difficulty</option>
  <option value="beginner">Beginner</option>
  <option value="intermediate">Intermediate</option>
  <option value="advanced">Advanced</option>
</select>

<button onclick="applyFilters()">Apply Filters</button>

<hr>

<h3>➕ Add Spot (Address)</h3>

<input id="name" placeholder="Name">

<select id="type">
  <option value="trail">Trail</option>
  <option value="mx">Track</option>
</select>

<select id="difficulty">
  <option value="beginner">Beginner</option>
  <option value="intermediate">Intermediate</option>
  <option value="advanced">Advanced</option>
</select>

<input id="address" placeholder="Street Address">
<input id="postal" placeholder="Postal Code">

<button onclick="addSpot()">Submit Spot</button>

<hr>

<div id="list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const SUPABASE_URL = "https://lwlartiyogwydsxljgqm.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_secret_LyNy5QBhp2aldVirxzCOdw_VQ50hSD0";

let map;
let markers = [];
let allSpots = []; // merged database

// 🧠 PRELOADED SPOTS (your built-in database)
const defaultSpots = [
  { id: "local1", name: "Club Moto MX", type: "mx", difficulty: "advanced", lat: 37.7016, lng: -121.7650 },
  { id: "local2", name: "Argyll MX Park", type: "mx", difficulty: "intermediate", lat: 38.4440, lng: -121.8200 },
  { id: "local3", name: "Corral Hollow OHV", type: "trail", difficulty: "intermediate", lat: 37.6200, lng: -121.5600 },
  { id: "local4", name: "Del Puerto Canyon", type: "trail", difficulty: "advanced", lat: 37.4550, lng: -121.1100 },
  { id: "local5", name: "Beginner Practice Area", type: "trail", difficulty: "beginner", lat: 37.6500, lng: -121.7000 }
];

// ---------- MAP ----------
function initMap() {
  map = L.map('map').setView([37.7749, -122.4194], 10);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);
}

// ---------- LOAD FROM SUPABASE ----------
async function loadFromDB() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/spots`, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    }
  });

  const data = await res.json();
  return data || [];
}

// ---------- MERGE DATA ----------
async function loadAll() {
  const dbSpots = await loadFromDB();
  allSpots = [...defaultSpots, ...dbSpots];
  render(allSpots);
}

// ---------- FILTER ----------
function applyFilters() {
  const type = document.getElementById("filterType").value;
  const diff = document.getElementById("filterDiff").value;

  const filtered = allSpots.filter(s => {
    if (type !== "all" && s.type !== type) return false;
    if (diff !== "all" && s.difficulty !== diff) return false;
    return true;
  });

  render(filtered);
}

// ---------- RENDER ----------
function render(spots) {
  document.getElementById("list").innerHTML = "";
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  spots.forEach(spot => {
    const marker = L.marker([spot.lat, spot.lng]).addTo(map);

    marker.bindPopup(`
      <b>${spot.name}</b><br>
      ${spot.type} | ${spot.difficulty}
    `);

    markers.push(marker);

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <b>${spot.name}</b><br>
      <span class="small">${spot.type} | ${spot.difficulty}</span>
    `;

    div.onclick = () => {
      map.setView([spot.lat, spot.lng], 13);
      marker.openPopup();
    };

    document.getElementById("list").appendChild(div);
  });
}

// ---------- GEOCODE ----------
async function getCoordinates(address, postal) {
  const query = encodeURIComponent(`${address}, ${postal}`);

  const res = await fetch(
    `https://nominatim.openstreetmap.org/search?format=json&q=${query}`
  );

  const data = await res.json();

  if (!data.length) {
    alert("Location not found");
    return null;
  }

  return {
    lat: parseFloat(data[0].lat),
    lng: parseFloat(data[0].lon)
  };
}

// ---------- ADD SPOT ----------
async function addSpot() {
  const coords = await getCoordinates(
    document.getElementById("address").value,
    document.getElementById("postal").value
  );

  if (!coords) return;

  const spot = {
    name: document.getElementById("name").value,
    type: document.getElementById("type").value,
    difficulty: document.getElementById("difficulty").value,
    lat: coords.lat,
    lng: coords.lng
  };

  await fetch(`${SUPABASE_URL}/rest/v1/spots`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(spot)
  });

  alert("Spot added!");
  loadAll();
}

// ---------- INIT ----------
initMap();
loadAll();
</script>

</body>
</html>
