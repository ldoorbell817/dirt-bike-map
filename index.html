<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dirt Bike Trails Finder</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }

    /* LEFT PANEL */
    .sidebar {
      width: 300px;
      background: #f5f5f5;
      padding: 15px;
      overflow-y: auto;
      box-shadow: 2px 0 8px rgba(0,0,0,0.1);
    }

    /* RIGHT MAP */
    #map {
      flex: 1;
    }

    h2 {
      margin-top: 0;
    }

    select, button {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
    }

    .trail {
      background: white;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .trail:hover {
      background: #eaeaea;
    }
  </style>
</head>

<body>

<!-- LEFT SIDE -->
<div class="sidebar">
  <h2>🏍️ Trails</h2>

  <label>Difficulty:</label>
  <select id="difficulty">
    <option value="all">All</option>
    <option value="beginner">Beginner</option>
    <option value="intermediate">Intermediate</option>
    <option value="advanced">Advanced</option>
  </select>

  <button onclick="findNearby()">Load Trails</button>

  <div id="trailList"></div>
</div>

<!-- RIGHT SIDE MAP -->
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let map;
let markers = [];

// Trail database
const trails = [
  { name: "Club Moto MX", type: "mx", difficulty: "advanced", coords: [37.7016, -121.7650] },
  { name: "Argyll MX Park", type: "mx", difficulty: "intermediate", coords: [38.4440, -121.8200] },
  { name: "Corral Hollow OHV", type: "trail", difficulty: "intermediate", coords: [37.6200, -121.5600] },
  { name: "Del Puerto Canyon", type: "trail", difficulty: "advanced", coords: [37.4550, -121.1100] },
  { name: "Beginner Practice Area", type: "trail", difficulty: "beginner", coords: [37.6500, -121.7000] }
];

function getColor(level) {
  if (level === "beginner") return "green";
  if (level === "intermediate") return "orange";
  return "red";
}

function initMap(lat, lng) {
  map = L.map('map').setView([lat, lng], 10);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  L.marker([lat, lng]).addTo(map)
    .bindPopup("📍 You are here")
    .openPopup();
}

function clearMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
}

function showTrails() {
  const filter = document.getElementById("difficulty").value;
  const list = document.getElementById("trailList");

  list.innerHTML = "";
  clearMarkers();

  trails.forEach(trail => {
    if (filter !== "all" && trail.difficulty !== filter) return;

    // Map marker
    const marker = L.circleMarker(trail.coords, {
      radius: 8,
      color: getColor(trail.difficulty),
      fillOpacity: 0.9
    }).addTo(map);

    marker.bindPopup(`<b>${trail.name}</b><br>${trail.difficulty}`);
    markers.push(marker);

    // Sidebar item
    const div = document.createElement("div");
    div.className = "trail";
    div.innerHTML = `
      <b>${trail.name}</b><br>
      Difficulty: ${trail.difficulty}
    `;

    div.onclick = () => {
      map.setView(trail.coords, 13);
      marker.openPopup();
    };

    list.appendChild(div);
  });
}

function findNearby() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      if (!map) initMap(lat, lng);
      showTrails();

    }, () => {
      initMap(37.7749, -122.4194);
      showTrails();
    });
  }
}
</script>

</body>
</html>
