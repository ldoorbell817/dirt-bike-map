<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dirt Bike Trails App</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 340px;
  background: #f4f4f4;
  padding: 12px;
  overflow-y: auto;
}

#map {
  flex: 1;
}

.item {
  background: white;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  cursor: pointer;
}

.item:hover { background: #eaeaea; }

input, select, button {
  width: 100%;
  padding: 6px;
  margin-top: 6px;
}

.small {
  font-size: 12px;
  color: gray;
}
</style>
</head>

<body>

<div class="sidebar">
<h2>🏍️ Dirt Bike App</h2>

<button onclick="loadSpots()">Load Spots</button>

<hr>

<h3>➕ Add Spot</h3>

<input id="name" placeholder="Name">
<select id="type">
  <option value="trail">Trail</option>
  <option value="mx">Track</option>
</select>

<select id="difficulty">
  <option value="beginner">Beginner</option>
  <option value="intermediate">Intermediate</option>
  <option value="advanced">Advanced</option>
</select>

<input id="lat" placeholder="Latitude">
<input id="lng" placeholder="Longitude">

<button onclick="addSpot()">Submit Spot</button>

<hr>

<div id="list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const SUPABASE_URL = "https://lwlartiyogwydsxljgqm.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_snTfGm6RFUZVX0HxsgQwaA_xCNqP2tu";

let map;
let markers = [];

// ---------- MAP ----------
function initMap() {
  map = L.map('map').setView([37.7749, -122.4194], 10);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);
}

// ---------- LOAD SPOTS ----------
async function loadSpots() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/spots`, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    }
  });

  const spots = await res.json();

  document.getElementById("list").innerHTML = "";
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  spots.forEach(spot => {
    const marker = L.marker([spot.lat, spot.lng]).addTo(map);

    marker.bindPopup(`
      <b>${spot.name}</b><br>
      Type: ${spot.type}<br>
      Difficulty: ${spot.difficulty}<br>
      ⭐ Rating: ${spot.rating || "0"}
    `);

    markers.push(marker);

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <b>${spot.name}</b><br>
      <span class="small">${spot.type} | ${spot.difficulty}</span><br>
      ⭐ ${spot.rating || 0}
    `;

    div.onclick = () => {
      map.setView([spot.lat, spot.lng], 13);
      marker.openPopup();
      loadReviews(spot.id);
    };

    document.getElementById("list").appendChild(div);
  });
}

// ---------- ADD SPOT ----------
async function addSpot() {
  const spot = {
    name: document.getElementById("name").value,
    type: document.getElementById("type").value,
    difficulty: document.getElementById("difficulty").value,
    lat: parseFloat(document.getElementById("lat").value),
    lng: parseFloat(document.getElementById("lng").value),
    rating: 0
  };

  await fetch(`${SUPABASE_URL}/rest/v1/spots`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(spot)
  });

  alert("Spot added!");
  loadSpots();
}

// ---------- REVIEWS ----------
async function loadReviews(spotId) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/reviews?spot_id=eq.${spotId}`, {
    headers: {
      apikey: SUPABASE_KEY
    }
  });

  const reviews = await res.json();

  let text = "Reviews:\n\n";
  reviews.forEach(r => {
    text += `⭐ ${r.stars} - ${r.text}\n`;
  });

  alert(text || "No reviews yet.");
}

// ---------- INIT ----------
initMap();
</script>

</body>
</html>
